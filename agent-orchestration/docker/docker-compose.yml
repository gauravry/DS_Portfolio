version: "3.9"
services:
  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"
      - "9009:9009"
    volumes:
      - ./questdb/init:/docker-entrypoint-initdb.d
    # environment:
    #   QDB_LOG_W_STDOUT: "true"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
